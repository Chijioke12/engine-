<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=240, height=320, user-scalable=no, initial-scale=1.0, maximum-scale=1.0">
  <title>KaiOS Game Engine</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    html, body {
      width: 240px;
      height: 320px;
      overflow: hidden;
      background-color: #000;
      color: #fff;
      font-family: sans-serif;
    }
    #canvas-container {
      width: 240px;
      height: 320px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
    }
    canvas#canvas {
      width: 240px;
      height: 320px;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
    }
    #loading {
      position: absolute;
      top: 0; left: 0;
      width: 240px; height: 320px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #090d16;
      font-size: 11px;
      letter-spacing: 0.5px;
      z-index: 10;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="spinner"></div>
    <p>Starting Engine...</p>
    <p style="color:#64748b; margin-top:4px; font-size:9px;">Gecko 48 / asm.js</p>
  </div>

  <div id="canvas-container">
    <canvas id="canvas" width="240" height="320" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
  </div>

  <script>
    var Module = {
      canvas: (function() {
        var canvas = document.getElementById('canvas');
        return canvas;
      })(),
      onRuntimeInitialized: function() {
        console.log("KaiOS C++ Lua Game Engine Initialized.");
        var loader = document.getElementById('loading');
        if (loader) loader.style.display = 'none';
      },
      print: function(text) { console.log(text); },
      printErr: function(text) { console.error(text); }
    };

    // Global Key Listener for KaiOS Hardware Keys
    window.addEventListener('keydown', function(e) {
      // Prevent KaiOS default softkey actions (like volume / options menus) during gameplay
      if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Enter', 'F1', 'F2', 'SoftLeft', 'SoftRight', 'Backspace'].indexOf(e.key) !== -1) {
        e.preventDefault();
      }
    });
  </script>
  <!-- Compiled asm.js engine binary generated by GitHub Actions -->
  <script src="engine.js"></script>
</body>
</html>
